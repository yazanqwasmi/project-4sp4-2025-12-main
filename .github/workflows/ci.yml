name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build-and-test:
    name: Build + unit tests (Linux, GCC, OpenMP)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build libomp-dev

      # MKL and CUDA are unavailable on hosted runners, so CI covers the
      # portable CPU path: custom GEMM/GEMV/SpMM/SpMV kernels and both
      # neural-network implementations. Vendor-library comparisons and the
      # CUDA kernels are exercised on the GPU cluster.
      - name: Configure
        run: >
          cmake -S . -B build -G Ninja
          -DCMAKE_BUILD_TYPE=Release
          -DUSE_MKL=OFF
          -DOPENMP=ON
          -DGPU_ENABLED=OFF

      - name: Build
        run: cmake --build build --parallel

      - name: Run unit tests
        run: ctest --test-dir build --output-on-failure
